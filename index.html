<script>
  // Claves de almacenamiento
  const USERS_KEY = 'mis_finanzas_users';
  const ACTIVE_USER_KEY = 'mis_finanzas_active_user';

  let currentUser = localStorage.getItem(ACTIVE_USER_KEY) || null;
  let entries = [];

  const PALETTE = ['#38bdf8', '#c084fc', '#f87171', '#34d399', '#fbbf24', '#f472b6', '#818cf8'];
  let selectedColor = PALETTE[0];
  let calendarMode = 'grid';
  let currentPeriodFilter = 'month';
  let selectedDayFilter = null;

  const dateNow = new Date();
  const currentMonthNum = dateNow.getMonth();
  const currentYear = dateNow.getFullYear();
  const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

  // Carga inicial
  window.addEventListener('DOMContentLoaded', () => {
    const titleEl = document.getElementById('currentMonthYear');
    if (titleEl) titleEl.innerText = `${monthNames[currentMonthNum]} ${currentYear}`;
    initColorPicker();
    checkAuthSession();
  });

  // --- Sistema de Autenticación Local ---
  function checkAuthSession() {
    currentUser = localStorage.getItem(ACTIVE_USER_KEY);
    const authScreen = document.getElementById('authScreen');
    const appHeader = document.querySelector('header');
    const heroBanner = document.querySelector('.hero-banner');
    const bottomBar = document.querySelector('.bottom-bar');
    const fab = document.querySelector('.fab');

    if (!currentUser) {
      if (authScreen) authScreen.style.display = 'flex';
      if (appHeader) appHeader.style.display = 'none';
      if (heroBanner) heroBanner.style.display = 'none';
      if (bottomBar) bottomBar.style.display = 'none';
      if (fab) fab.style.display = 'none';
      document.querySelectorAll('.view-content').forEach(v => v.style.display = 'none');
    } else {
      if (authScreen) authScreen.style.display = 'none';
      if (appHeader) appHeader.style.display = 'flex';
      if (heroBanner) heroBanner.style.display = 'block';
      if (bottomBar) bottomBar.style.display = 'flex';
      if (fab) fab.style.display = 'flex';

      const userBadge = document.getElementById('displayUsername');
      if (userBadge) userBadge.innerText = currentUser;

      loadUserData();
      switchTab('calendar', document.querySelector('.tab-link'));
    }
  }

  function handleLogin(e) {
    if (e) e.preventDefault();
    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value.trim();

    const users = JSON.parse(localStorage.getItem(USERS_KEY)) || {};
    if (users[user] && users[user] === pass) {
      localStorage.setItem(ACTIVE_USER_KEY, user);
      checkAuthSession();
    } else {
      alert('Usuario o contraseña incorrectos.');
    }
  }

  function handleRegister(e) {
    if (e) e.preventDefault();
    const user = document.getElementById('regUser').value.trim();
    const pass = document.getElementById('regPass').value.trim();

    if (!user || !pass) {
      alert('Ingresa un usuario y una contraseña.');
      return;
    }

    const users = JSON.parse(localStorage.getItem(USERS_KEY)) || {};
    if (users[user]) {
      alert('Este usuario ya existe.');
      return;
    }

    users[user] = pass;
    localStorage.setItem(USERS_KEY, JSON.stringify(users));
    localStorage.setItem(ACTIVE_USER_KEY, user);
    localStorage.setItem(`finanzas_data_${user}`, JSON.stringify([]));
    checkAuthSession();
  }

  function logout() {
    localStorage.removeItem(ACTIVE_USER_KEY);
    checkAuthSession();
  }

  function loadUserData() {
    if (!currentUser) return;
    const raw = localStorage.getItem(`finanzas_data_${currentUser}`);
    entries = raw ? JSON.parse(raw) : [];
    renderAll();
  }

  function saveAndRefresh() {
    if (!currentUser) return;
    localStorage.setItem(`finanzas_data_${currentUser}`, JSON.stringify(entries));
    renderAll();
  }

  // --- Selección de Color ---
  function initColorPicker() {
    const container = document.getElementById('colorPickerList');
    if (!container) return;
    container.innerHTML = '';
    PALETTE.forEach(c => {
      const swatch = document.createElement('div');
      swatch.className = 'color-swatch' + (c === selectedColor ? ' active' : '');
      swatch.style.backgroundColor = c;
      swatch.onclick = () => {
        document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
        swatch.classList.add('active');
        selectedColor = c;
      };
      container.appendChild(swatch);
    });
  }

  // --- Renderizado General ---
  function renderAll() {
    renderHeroLiquidity();
    renderCalendar();
    renderPaymentsList();
    renderCredits();
    renderBillsAndExtras();
  }

  function setPeriodFilter(filterType, btn) {
    document.querySelectorAll('.pill-filter').forEach(p => p.classList.remove('active'));
    if (btn) btn.classList.add('active');
    currentPeriodFilter = filterType;
    selectedDayFilter = null;
    renderAll();
  }

  function renderHeroLiquidity() {
    let filtered = entries;
    const today = dateNow.getDate();

    if (selectedDayFilter !== null) {
      filtered = entries.filter(e => Number(e.day) === selectedDayFilter);
      document.getElementById('liquidityLabel').innerText = `Total el día ${selectedDayFilter}`;
    } else if (currentPeriodFilter === 'week') {
      filtered = entries.filter(e => e.day >= today && e.day <= (today + 7));
      document.getElementById('liquidityLabel').innerText = 'Total esta semana';
    } else if (currentPeriodFilter === 'fifteen') {
      filtered = entries.filter(e => e.day >= today && e.day <= (today + 15));
      document.getElementById('liquidityLabel').innerText = 'Total en 15 días';
    } else {
      document.getElementById('liquidityLabel').innerText = 'Total en este mes';
    }

    const total = filtered.reduce((acc, curr) => acc + Number(curr.amount || 0), 0);
    document.getElementById('periodTotalDisplay').innerText = '$' + total.toLocaleString('es-MX', { minimumFractionDigits: 2 });
    document.getElementById('itemCountBadge').innerText = `${filtered.length} compromiso(s)`;
  }

  function setCalendarMode(mode) {
    calendarMode = mode;
    const bGrid = document.getElementById('btnModeGrid');
    const bList = document.getElementById('btnModeList');
    if (bGrid) bGrid.classList.toggle('active', mode === 'grid');
    if (bList) bList.classList.toggle('active', mode === 'list');
    const wrap = document.getElementById('calendarGridWrapper');
    if (wrap) wrap.style.display = mode === 'grid' ? 'block' : 'none';
    renderPaymentsList();
  }

  function renderCalendar() {
    const grid = document.getElementById('calendarDaysGrid');
    if (!grid) return;
    grid.innerHTML = '';
    ['D', 'L', 'M', 'M', 'J', 'V', 'S'].forEach(d => {
      grid.innerHTML += `<div class="cal-header-cell">${d}</div>`;
    });

    const totalDays = new Date(currentYear, currentMonthNum + 1, 0).getDate();
    for (let day = 1; day <= totalDays; day++) {
      const dayEntries = entries.filter(e => Number(e.day) === day);
      const cell = document.createElement('div');
      cell.className = 'cal-cell' + (selectedDayFilter === day ? ' selected' : '');
      cell.innerHTML = `<span>${day}</span>`;

      if (dayEntries.length > 0) {
        const dots = document.createElement('div');
        dots.className = 'cal-dots';
        dayEntries.slice(0, 3).forEach(e => {
          dots.innerHTML += `<div class="cal-dot" style="background-color: ${e.color || 'var(--accent)'}"></div>`;
        });
        cell.appendChild(dots);
      }

      cell.onclick = () => {
        selectedDayFilter = selectedDayFilter === day ? null : day;
        renderAll();
      };
      grid.appendChild(cell);
    }
  }

  function renderPaymentsList() {
    const container = document.getElementById('paymentRowsContainer');
    if (!container) return;
    container.innerHTML = '';
    let list = [...entries];

    if (calendarMode === 'list') {
      list = list.sort((a, b) => a.day - b.day);
    } else if (selectedDayFilter !== null) {
      list = list.filter(e => Number(e.day) === selectedDayFilter);
    } else {
      list = list.sort((a, b) => a.day - b.day);
    }

    if (list.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <p><strong>Sin compromisos registrados</strong><br>Presiona el botón "+" para agregar tu primer pago.</p>
        </div>
      `;
      return;
    }

    list.forEach(item => {
      const row = document.createElement('div');
      row.className = 'payment-row';
      row.style.borderLeftColor = item.color || 'var(--accent)';
      const subtitle = item.type === 'credito' 
        ? `Parcialidad ${item.currentInstallment || 1} de ${item.totalInstallments || 1}`
        : (item.type === 'recibo' ? 'Recibo fijo' : 'Gasto extra');

      row.innerHTML = `
        <div>
          <h4 style="font-size:0.92rem;font-weight:700;">${item.desc} <span class="bank-badge">${item.bank || 'General'}</span></h4>
          <div class="payment-sub">Día ${item.day} • ${subtitle}</div>
        </div>
        <div style="text-align:right;">
          <div class="payment-amount">$${Number(item.amount).toLocaleString('es-MX', { minimumFractionDigits: 2 })}</div>
          <div style="margin-top:6px;">
            <button class="icon-btn" onclick="editEntry(${item.id})">Editar</button>
            <button class="icon-btn" onclick="deleteEntry(${item.id})" style="color:var(--danger);">Eliminar</button>
          </div>
        </div>
      `;
      container.appendChild(row);
    });
  }

  function renderCredits() {
    const container = document.getElementById('creditCardsContainer');
    if (!container) return;
    container.innerHTML = '';
    const credits = entries.filter(e => e.type === 'credito');

    const totalDebt = credits.reduce((sum, c) => sum + Number(c.currentBalance || 0), 0);
    const debtLabel = document.getElementById('totalDebtStat');
    if (debtLabel) debtLabel.innerText = `Deuda total: $${totalDebt.toLocaleString('es-MX', { minimumFractionDigits: 2 })}`;

    if (credits.length === 0) {
      container.innerHTML = `<div class="empty-state"><p>No hay créditos dados de alta.<br>Usa "+" con el tipo "Crédito".</p></div>`;
      return;
    }

    credits.forEach(c => {
      const init = Number(c.initialBalance) || Number(c.amount);
      const curr = Number(c.currentBalance) || 0;
      const paidPercent = Math.min(100, Math.max(0, Math.round(((init - curr) / init) * 100))) || 0;

      const card = document.createElement('div');
      card.className = 'credit-card-pro';
      card.innerHTML = `
        <div class="credit-accent-bar" style="background: ${c.color || 'var(--accent)'};"></div>
        <div class="credit-header">
          <div>
            <span class="bank-badge">${c.bank || 'Institución'}</span>
            <h3 style="font-size:1.05rem;font-weight:700;margin-top:4px;">${c.desc}</h3>
          </div>
          <div class="credit-installment">Cuota ${c.currentInstallment || 1} / ${c.totalInstallments || 1}</div>
        </div>
        <div class="credit-stats">
          <div class="stat-box">Saldo Inicial<div class="stat-val">$${Number(init).toLocaleString('es-MX')}</div></div>
          <div class="stat-box">Restante<div class="stat-val" style="color:var(--danger);">$${Number(curr).toLocaleString('es-MX')}</div></div>
          <div class="stat-box">Cuota<div class="stat-val" style="color:var(--accent);">$${Number(c.amount).toLocaleString('es-MX')}</div></div>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" style="width:${paidPercent}%;background:${c.color || 'var(--accent)'};"></div>
        </div>
        <div class="credit-actions">
          <span style="font-size:0.72rem;color:var(--text-muted);">${paidPercent}% liquidado • Día ${c.day}</span>
          <div>
            <button class="btn-pay-installment" onclick="payCreditInstallment(${c.id})">Avanzar pago</button>
            <button class="icon-btn" onclick="editEntry(${c.id})">Editar</button>
            <button class="icon-btn" onclick="deleteEntry(${c.id})" style="color:var(--danger);">Eliminar</button>
          </div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function payCreditInstallment(id) {
    const idx = entries.findIndex(e => e.id === id);
    if (idx === -1) return;
    const c = entries[idx];
    c.currentInstallment = (Number(c.currentInstallment) || 1) + 1;
    c.currentBalance = Math.max(0, (Number(c.currentBalance) || 0) - Number(c.amount));
    saveAndRefresh();
  }

  function renderBillsAndExtras() {
    const bills = entries.filter(e => e.type === 'recibo');
    const extras = entries.filter(e => e.type === 'extra');
    const bContainer = document.getElementById('billsContainer');
    const eContainer = document.getElementById('extrasContainer');

    if (bContainer) {
      bContainer.innerHTML = bills.length === 0 ? `<div class="empty-state"><p>No hay recibos fijos.</p></div>` : '';
      bills.forEach(b => { bContainer.innerHTML += createMiniRow(b); });
    }
    if (eContainer) {
      eContainer.innerHTML = extras.length === 0 ? `<div class="empty-state"><p>No hay gastos extra.</p></div>` : '';
      extras.forEach(x => { eContainer.innerHTML += createMiniRow(x); });
    }
  }

  function createMiniRow(item) {
    return `
      <div class="payment-row" style="border-left-color:${item.color || 'var(--accent)'}">
        <div>
          <h4 style="font-size:0.92rem;font-weight:700;">${item.desc} <span class="bank-badge">${item.bank || 'Servicio'}</span></h4>
          <div class="payment-sub">Día ${item.day} de cada mes</div>
        </div>
        <div style="text-align:right;">
          <div class="payment-amount">$${Number(item.amount).toLocaleString('es-MX', { minimumFractionDigits: 2 })}</div>
          <div style="margin-top:6px;">
            <button class="icon-btn" onclick="editEntry(${item.id})">Editar</button>
            <button class="icon-btn" onclick="deleteEntry(${item.id})" style="color:var(--danger);">Eliminar</button>
          </div>
        </div>
      </div>
    `;
  }

  function switchTab(tab, btn) {
    document.querySelectorAll('.tab-link').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view-content').forEach(v => {
      v.classList.remove('active');
      v.style.display = 'none';
    });
    if (btn) btn.classList.add('active');

    const target = document.getElementById(tab === 'calendar' ? 'viewCalendar' : (tab === 'credits' ? 'viewCredits' : 'viewExpenses'));
    if (target) {
      target.classList.add('active');
      target.style.display = 'block';
    }
  }

  // --- Modal y Guardado Seguro ---
  function openAddModal() {
    document.getElementById('editEntryId').value = '';
    document.getElementById('modalTitle').innerText = 'Nuevo Registro';
    document.getElementById('entryDesc').value = '';
    document.getElementById('entryBank').value = '';
    document.getElementById('entryAmount').value = '';
    document.getElementById('entryDay').value = '';
    document.getElementById('entryInitialBalance').value = '';
    document.getElementById('entryCurrentBalance').value = '';
    document.getElementById('entryCurrentInstallment').value = '1';
    document.getElementById('entryTotalInstallments').value = '12';
    document.getElementById('entryType').value = 'credito';
    toggleFormFields();
    initColorPicker();
    document.getElementById('entryModal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('entryModal').classList.remove('open');
  }

  function toggleFormFields() {
    const type = document.getElementById('entryType').value;
    const credBox = document.getElementById('creditFields');
    if (credBox) credBox.style.display = type === 'credito' ? 'block' : 'none';
  }

  function saveEntry() {
    const editId = document.getElementById('editEntryId').value;
    const desc = document.getElementById('entryDesc').value.trim();
    const bank = document.getElementById('entryBank').value.trim();
    const amountVal = document.getElementById('entryAmount').value.trim();
    const dayVal = document.getElementById('entryDay').value.trim();
    const type = document.getElementById('entryType').value;

    const amount = parseFloat(amountVal);
    const day = parseInt(dayVal, 10);

    if (!desc) {
      alert('Por favor escribe el concepto o nombre del crédito.');
      return;
    }
    if (isNaN(amount) || amount <= 0) {
      alert('Por favor ingresa un monto válido mayor a 0.');
      return;
    }
    if (isNaN(day) || day < 1 || day > 31) {
      alert('Ingresa un día de pago válido (del 1 al 31).');
      return;
    }

    // Extracción segura de saldos para evitar bloqueos por NaN
    const rawInit = parseFloat(document.getElementById('entryInitialBalance').value);
    const rawCurr = parseFloat(document.getElementById('entryCurrentBalance').value);
    const rawCurInst = parseInt(document.getElementById('entryCurrentInstallment').value, 10);
    const rawTotInst = parseInt(document.getElementById('entryTotalInstallments').value, 10);

    const initialBalance = !isNaN(rawInit) && rawInit > 0 ? rawInit : amount;
    const currentBalance = !isNaN(rawCurr) && rawCurr >= 0 ? rawCurr : initialBalance;
    const currentInstallment = !isNaN(rawCurInst) && rawCurInst > 0 ? rawCurInst : 1;
    const totalInstallments = !isNaN(rawTotInst) && rawTotInst > 0 ? rawTotInst : 1;

    const itemData = {
      id: editId ? Number(editId) : Date.now(),
      desc,
      bank: bank || 'Sin banco',
      amount,
      day,
      type,
      color: selectedColor,
      initialBalance,
      currentBalance,
      currentInstallment,
      totalInstallments
    };

    if (editId) {
      const index = entries.findIndex(e => e.id === Number(editId));
      if (index !== -1) entries[index] = itemData;
    } else {
      entries.push(itemData);
    }

    closeModal();
    saveAndRefresh();

    // Redirige automáticamente a la pestaña de Créditos si se guardó un crédito
    if (type === 'credito') {
      const tabCreditsBtn = document.querySelectorAll('.tab-link')[1];
      switchTab('credits', tabCreditsBtn);
    }
  }

  function editEntry(id) {
    const item = entries.find(e => e.id === id);
    if (!item) return;

    document.getElementById('editEntryId').value = item.id;
    document.getElementById('modalTitle').innerText = 'Editar Registro';
    document.getElementById('entryType').value = item.type;
    document.getElementById('entryBank').value = item.bank || '';
    document.getElementById('entryDesc').value = item.desc;
    document.getElementById('entryAmount').value = item.amount;
    document.getElementById('entryDay').value = item.day;
    document.getElementById('entryInitialBalance').value = item.initialBalance || '';
    document.getElementById('entryCurrentBalance').value = item.currentBalance || '';
    document.getElementById('entryCurrentInstallment').value = item.currentInstallment || '';
    document.getElementById('entryTotalInstallments').value = item.totalInstallments || '';

    selectedColor = item.color || PALETTE[0];
    initColorPicker();
    toggleFormFields();
    document.getElementById('entryModal').classList.add('open');
  }

  function deleteEntry(id) {
    if (confirm('¿Eliminar este registro de forma permanente?')) {
      entries = entries.filter(e => e.id !== id);
      saveAndRefresh();
    }
  }

  // --- Exportar e Importar Respaldo ---
  function exportBackup() {
    if (!currentUser) return;
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(entries, null, 2));
    const dlAnchor = document.createElement('a');
    dlAnchor.setAttribute("href", dataStr);
    dlAnchor.setAttribute("download", `mis_finanzas_${currentUser}_${Date.now()}.json`);
    dlAnchor.click();
    dlAnchor.remove();
  }

  function importBackup(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const imported = JSON.parse(e.target.result);
        if (Array.isArray(imported)) {
          entries = imported;
          saveAndRefresh();
          alert('¡Respaldo restaurado con éxito!');
        } else {
          alert('El archivo de respaldo no tiene el formato correcto.');
        }
      } catch (err) {
        alert('Error al leer el archivo de respaldo.');
      }
    };
    reader.readAsText(file);
  }
</script>
